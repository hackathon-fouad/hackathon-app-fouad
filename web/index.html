<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackathon</title>
  </head>
  <body class="min-h-screen bg-background font-sans text-text">
    <main class="mx-auto flex max-w-2xl flex-col gap-6 px-4 py-10">
      <header class="flex flex-col gap-1">
        <h1 class="text-2xl font-semibold">Hackathon</h1>
        <p id="health" class="truncate text-sm text-muted">Connexion à l'API…</p>
      </header>

      <form class="flex gap-2">
        <input
          name="question"
          placeholder="Posez une question à l'IA"
          required
          class="flex-1 rounded-control border border-border bg-surface px-3 py-2 outline-none focus-visible:border-primary focus-visible:ring-2 focus-visible:ring-primary/30"
        />
        <button
          class="rounded-control bg-primary px-4 py-2 font-medium text-on-primary hover:bg-primary-hover focus-visible:ring-2 focus-visible:ring-primary/30 focus-visible:outline-none"
        >
          Envoyer
        </button>
      </form>

      <ul id="questions" class="flex flex-col gap-3"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
