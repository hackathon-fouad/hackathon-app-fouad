server {
  listen 80;
  root /usr/share/nginx/html;

  # Même rôle que le proxy de vite.config.ts en dev : le navigateur n'appelle
  # qu'une seule origine, nginx relaie /api vers le service api de Compose
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Un petit modèle sur CPU peut mettre plusieurs dizaines de secondes à répondre
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
