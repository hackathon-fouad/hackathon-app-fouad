server {
  listen 80;
  root /usr/share/nginx/html;

  # Même rôle que le proxy de vite.config.ts en dev : le navigateur n'appelle
  # qu'une seule origine, nginx relaie /api vers le service api de Compose
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Sur le processeur, le copilote peut dépasser deux minutes (issue #26).
    # Même valeur que le délai par défaut de fetch dans Node, côté API.
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
