name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Même version de Node que le Dev Container et la production
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vérifier les types de l'API
        run: npx -w api tsc --noEmit

      - name: Construire le front
        run: npm run build -w web
