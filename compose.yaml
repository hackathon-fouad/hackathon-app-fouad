# La stack complète. `docker compose up` lance l'écran, l'API, l'IA et la base.
# Versions figées : les mêmes qu'en production.
name: hackathon

services:
  # Le front construit, servi par nginx, qui relaie /api vers l'API
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # api/.env n'est pas commité : la configuration vient d'ici
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      COPILOT_URL: http://copilot:8000
    depends_on:
      db:
        condition: service_healthy
      copilot:
        condition: service_healthy

  # Le copilote de l'équipe data (ADR 0007), construit depuis son dépôt GitHub sans
  # le modifier. Figé sur un commit : pour prendre ses nouveautés, changer le SHA par PR.
  copilot:
    build:
      context: https://github.com/sergiovanni/Casque-projet_data.git#76be150c1cee189366098acaa914583f27dc1c1a
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        # Indexe story.txt dans ChromaDB, puis lance l'API sur toutes les interfaces
        CMD ["sh", "-c", "python ingest.py && uvicorn api:app --host 0.0.0.0 --port 8000"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: llama3.2:3b
      EMBED_MODEL: nomic-embed-text
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 60

  # L'IA en local, sans clé ni quota. Les modèles restent dans le volume ollama.
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Télécharge les modèles du copilote au premier lancement (environ 2,3 Go),
  # puis s'arrête. Les lancements suivants les trouvent déjà dans le volume.
  ollama-pull:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2:3b && ollama pull nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

  # Le poste de travail : VS Code s'y attache, on y lance l'API et le front en dev
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    extra_hosts:
      # Rend l'hôte joignable sous Linux (Docker Desktop le fait déjà)
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Les données, dans un dossier du projet (ignoré par git)
      - ./db/data:/var/lib/postgresql/data
      # Schéma et données de test, joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ollama:
